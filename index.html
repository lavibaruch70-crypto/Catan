<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Vibe Quest 3D - The Cyber Empire</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(17, 24, 39, 0.85);
            --accent-blue: #38bdf8;
            --accent-purple: #c084fc;
            --accent-green: #34d399;
            --accent-gold: #fbbf24;
            --accent-rose: #fb7185;
            --text-color: #f3f4f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rubik', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background: radial-gradient(circle at center, #1e1b4b 0%, #030712 100%);
            overflow-x: hidden;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 5px;
            background: linear-gradient(45deg, var(--accent-blue), var(--accent-purple), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
            text-align: center;
        }

        .subtitle { font-size: 1rem; color: #9ca3af; margin-bottom: 25px; text-align: center; }

        .game-wrapper {
            display: flex;
            gap: 30px;
            max-width: 1400px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
            perspective: 1200px;
        }

        /* הלוח בתלת ממד */
        .board-viewport {
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 12px;
            width: 620px;
            height: 620px;
            background: rgba(15, 23, 42, 0.9);
            padding: 20px;
            border-radius: 28px;
            border: 2px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 40px rgba(56, 189, 248, 0.15);
            transform: rotateX(20deg) rotateZ(0deg);
            transition: transform 0.5s ease;
            position: relative;
            transform-style: preserve-3d;
        }

        .board:hover {
            transform: rotateX(10deg) rotateZ(0deg);
        }

        .tile {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            text-align: center;
            font-size: 0.85rem;
            position: relative;
            transition: all 0.3s ease;
            transform-style: preserve-3d;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.02);
        }

        .tile-owner-indicator {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            box-shadow: 0 0 8px currentColor;
        }

        .tile-level {
            position: absolute;
            top: 4px;
            left: 6px;
            font-size: 0.7rem;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .tile-center {
            grid-column: 2 / 5;
            grid-row: 2 / 5;
            background: rgba(15, 23, 42, 0.95);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px dashed rgba(192, 132, 252, 0.3);
            padding: 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .tile-icon { font-size: 1.8rem; margin-bottom: 4px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
        .tile-title { font-weight: 600; color: #f3f4f6; }
        .tile-price { font-size: 0.75rem; color: #9ca3af; margin-top: 2px; }

        /* חיילי 3D אינטראקטיביים */
        .tokens-container {
            position: absolute;
            bottom: 6px;
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .player-token-3d {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff, currentColor);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.6), 0 0 12px currentColor;
            transform: translateZ(15px);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: float 3s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translateZ(15px) translateY(0px); }
            100% { transform: translateZ(22px) translateY(-4px); }
        }

        /* פאנלים צדדיים */
        .side-panel {
            flex: 1;
            min-width: 340px;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 22px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .players-list { display: flex; flex-direction: column; gap: 12px; }

        .player-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid transparent;
            transition: 0.3s;
        }

        .player-card.active {
            border-color: var(--accent-blue);
            background: rgba(56, 189, 248, 0.15);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .player-info { display: flex; align-items: center; gap: 12px; }
        .player-avatar-3d {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fff, currentColor);
            box-shadow: 0 0 10px currentColor;
        }

        .player-stats { font-size: 0.85rem; line-height: 1.4; text-align: left; }

        /* קוביה */
        .dice-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .dice {
            width: 70px;
            height: 70px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #e2e8f0);
            color: #0f172a;
            font-size: 2.2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2), inset 0 -4px 0 #cbd5e1;
            transition: transform 0.5s ease;
        }

        .roll-animation { animation: roll3d 0.6s ease-out; }
        @keyframes roll3d {
            0% { transform: rotateX(0deg) rotateY(0deg) scale(0.6); }
            50% { transform: rotateX(360deg) rotateY(180deg) scale(1.2); }
            100% { transform: rotateX(720deg) rotateY(360deg) scale(1); }
        }

        /* לחצני פעולה אסטרטגיים */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            border: none;
            padding: 12px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
        }

        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-gold { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); }
        .btn-green { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }

        .log-box {
            height: 140px;
            overflow-y: auto;
            font-size: 0.85rem;
            color: #d1d5db;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 5px;
        }

        .log-entry {
            padding: 6px 10px;
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            border-right: 3px solid var(--accent-blue);
        }

        /* Modal קבלת החלטות */
        .modal-overlay {
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal {
            background: var(--card-bg);
            border: 2px solid var(--accent-purple);
            padding: 30px;
            border-radius: 24px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(192, 132, 252, 0.3);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal { transform: scale(1); }

        .modal-title { font-size: 1.5rem; color: var(--accent-gold); margin-bottom: 10px; }
        .modal-desc { font-size: 0.95rem; color: #e5e7eb; margin-bottom: 20px; line-height: 1.5; }
        .modal-buttons { display: flex; gap: 10px; justify-content: center; }
    </style>
</head>
<body>

    <h1>GEMINI VIBE QUEST 3D</h1>
    <div class="subtitle">האימפריה הדיגיטלית - הנפק, בנה, סחור וכבוש את הלוח (הראשון ל-40 נקודות!)</div>

    <div class="game-wrapper">
        <div class="board-viewport">
            <div class="board" id="board">
                <div class="tile-center">
                    <div class="dice-area">
                        <div class="dice" id="dice">🎲</div>
                        <button class="btn" id="roll-btn" onclick="playTurn()">הטל קוביה</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="side-panel">
            <div class="card">
                <h3>👥 סטטוס יזמים</h3>
                <div class="players-list" id="players-list"></div>
            </div>

            <div class="card">
                <h3>⚡ פעולות אסטרטגיות בתור</h3>
                <div class="action-grid">
                    <button class="btn btn-gold" id="ipo-btn" onclick="executeIPO()" disabled>📈 הנפקת מניות (IPO)</button>
                    <button class="btn btn-green" id="incubator-btn" onclick="buildIncubator()" disabled>🏗️ חממת סטרטאפים</button>
                </div>
            </div>

            <div class="card">
                <h3>📜 יומן אירועים</h3>
                <div class="log-box" id="log-box"></div>
            </div>
        </div>
    </div>

    <!-- Modal דיאלוג לקבלת החלטות -->
    <div class="modal-overlay" id="decision-modal">
        <div class="modal">
            <div class="modal-title" id="modal-title">הזדמנות עסקים</div>
            <div class="modal-desc" id="modal-desc">מה תרצה לעשות?</div>
            <div class="modal-buttons" id="modal-buttons"></div>
        </div>
    </div>

    <script>
        const TARGET_POINTS = 40;
        const playerColors = ['#38bdf8', '#c084fc', '#34d399', '#fbbf24'];

        // הגדרת משבצות הלוח
        const boardTiles = [
            { id: 0, title: "הזנק (Start)", icon: "🚀", type: "start" },
            { id: 1, title: "מעבדת AI", icon: "🤖", type: "property", cost: 25, points: 3, rent: 10, owner: null, level: 1 },
            { id: 2, title: "חברת פרילנס", icon: "💻", type: "work", income: 20 },
            { id: 3, title: "מניות Cloud", icon: "☁️", type: "property", cost: 35, points: 4, rent: 15, owner: null, level: 1 },
            { id: 4, title: "קרן הון סיכון", icon: "🎲", type: "event" },
            { id: 5, title: "אקדמיית סייבר", icon: "🎓", type: "study", cost: 40, points: 5, eduBoost: 1 },
            { id: 6, title: "מרכז דאטה", icon: "🖥️", type: "property", cost: 50, points: 6, rent: 20, owner: null, level: 1 },
            { id: 7, title: "סחור בקריפטו", icon: "🪙", type: "trade", cost: 30, points: 4 },
            { id: 8, title: "הפסקת קפה", icon: "☕", type: "rest" },
            { id: 9, title: "פרויקט אלגוריתמי", icon: "⚡", type: "work", income: 45 },
            { id: 10, title: "חברת פינטק", icon: "🏦", type: "property", cost: 70, points: 9, rent: 30, owner: null, level: 1 },
            { id: 11, title: "נדל״ן וירטואלי", icon: "🏙️", type: "property", cost: 85, points: 11, rent: 40, owner: null, level: 1 },
            { id: 12, title: "אקזיט פתאומי", icon: "🎁", type: "event" },
            { id: 13, title: "חממת הייטק", icon: "🌐", type: "property", cost: 100, points: 14, rent: 50, owner: null, level: 1 },
            { id: 14, title: "עסקת ענק (B2B)", icon: "💼", type: "work", income: 70 },
            { id: 15, title: "פטנט AI עולמי", icon: "💡", type: "property", cost: 120, points: 18, rent: 65, owner: null, level: 1 }
        ];

        // מיקומים בגרייד 5x5
        const gridPositions = [
            {r:5, c:5}, {r:5, c:4}, {r:5, c:3}, {r:5, c:2}, {r:5, c:1},
            {r:4, c:1}, {r:3, c:1}, {r:2, c:1}, {r:1, c:1},
            {r:1, c:2}, {r:1, c:3}, {r:1, c:4}, {r:1, c:5},
            {r:2, c:5}, {r:3, c:5}, {r:4, c:5}
        ];

        let players = [
            { id: 1, name: "Gemini", color: playerColors[0], position: 0, money: 50, points: 0, eduLevel: 1, incubators: 0 },
            { id: 2, name: "Nexus", color: playerColors[1], position: 0, money: 50, points: 0, eduLevel: 1, incubators: 0 },
            { id: 3, name: "Cyber", color: playerColors[2], position: 0, money: 50, points: 0, eduLevel: 1, incubators: 0 }
        ];

        let currentPlayerIndex = 0;
        let turnHasRolled = false;

        function initBoard() {
            const boardEl = document.getElementById('board');
            
            boardTiles.forEach((tile, index) => {
                const pos = gridPositions[index];
                const tileEl = document.createElement('div');
                tileEl.className = 'tile';
                tileEl.id = `tile-${index}`;
                tileEl.style.gridRow = pos.r;
                tileEl.style.gridColumn = pos.c;
                
                tileEl.innerHTML = `
                    <div class="tile-level" id="tile-lvl-${index}"></div>
                    <div class="tile-owner-indicator" id="tile-owner-${index}"></div>
                    <div class="tile-icon">${tile.icon}</div>
                    <div class="tile-title">${tile.title}</div>
                    <div class="tile-price">${tile.cost ? '$' + tile.cost : ''}</div>
                    <div class="tokens-container" id="tokens-${index}"></div>
                `;
                boardEl.appendChild(tileEl);
            });

            updateUI();
            log("🎮 המשחק הושק! בנה אימפריה והגע ל-40 נקודות.");
        }

        function updateUI() {
            // עדכון רשימת שחקנים
            const playersList = document.getElementById('players-list');
            playersList.innerHTML = '';
            
            players.forEach((p, idx) => {
                const card = document.createElement('div');
                card.className = `player-card ${idx === currentPlayerIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="player-info">
                        <div class="player-avatar-3d" style="color: ${p.color}"></div>
                        <div>
                            <strong>${p.name}</strong>
                            <div style="font-size: 0.75rem; color: #9ca3af;">חממות: ${p.incubators}</div>
                        </div>
                    </div>
                    <div class="player-stats">
                        💰 $${p.money}<br>
                        🏆 <strong>${p.points}</strong> pts
                    </div>
                `;
                playersList.appendChild(card);
            });

            // עדכון חיילים בלוח (3D Tokens)
            boardTiles.forEach((tile, idx) => {
                const container = document.getElementById(`tokens-${idx}`);
                container.innerHTML = '';

                // עדכון בעלות
                const ownerEl = document.getElementById(`tile-owner-${idx}`);
                const lvlEl = document.getElementById(`tile-lvl-${idx}`);
                if (tile.owner !== null) {
                    ownerEl.style.backgroundColor = players[tile.owner].color;
                    lvlEl.innerText = `L${tile.level}`;
                } else {
                    ownerEl.style.backgroundColor = 'transparent';
                    lvlEl.innerText = '';
                }
            });

            players.forEach(p => {
                const container = document.getElementById(`tokens-${p.position}`);
                const token = document.createElement('div');
                token.className = 'player-token-3d';
                token.style.color = p.color;
                container.appendChild(token);
            });

            // כפתורים אסטרטגיים
            const curPlayer = players[currentPlayerIndex];
            document.getElementById('ipo-btn').disabled = turnHasRolled || curPlayer.points < 2;
            document.getElementById('incubator-btn').disabled = turnHasRolled || curPlayer.money < 60;
        }

        function log(msg) {
            const logBox = document.getElementById('log-box');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerText = msg;
            logBox.prepend(entry);
        }

        function playTurn() {
            if (turnHasRolled) return;

            const rollBtn = document.getElementById('roll-btn');
            rollBtn.disabled = true;

            const diceEl = document.getElementById('dice');
            diceEl.classList.add('roll-animation');
            
            setTimeout(() => {
                const roll = Math.floor(Math.random() * 6) + 1;
                diceEl.innerText = roll;
                diceEl.classList.remove('roll-animation');

                const player = players[currentPlayerIndex];
                player.position = (player.position + roll) % boardTiles.length;
                turnHasRolled = true;

                log(`🎲 ${player.name} הטיל/ה ${roll} ונחת/ה על ${boardTiles[player.position].title}`);

                // בונוס חממות בתחילת תור
                if (player.incubators > 0) {
                    let incIncome = player.incubators * 15;
                    player.money += incIncome;
                    player.points += player.incubators;
                    log(`🏗️ חממות הייטק הניבו ל-${player.name} $${incIncome} ו-${player.incubators} נק'`);
                }

                updateUI();
                handleTileAction(player, boardTiles[player.position]);

            }, 600);
        }

        function finishTurn() {
            const player = players[currentPlayerIndex];

            // בדיקת ניצחון
            if (player.points >= TARGET_POINTS) {
                showModal("🎉 ניצחון מוחץ!", `${player.name} כבש/ה את העיר הדיגיטלית עם ${player.points} נקודות ניצחון!`, [
                    { text: "משחק חדש", btnClass: "btn-green", action: () => location.reload() }
                ]);
                return;
            }

            currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
            turnHasRolled = false;
            document.getElementById('roll-btn').disabled = false;
            updateUI();
        }

        /* מנוע החלטות אינטראקטיבי modal */
        function showModal(title, desc, buttons) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            const btnContainer = document.getElementById('modal-buttons');
            btnContainer.innerHTML = '';

            buttons.forEach(b => {
                const btn = document.createElement('button');
                btn.className = `btn ${b.btnClass || ''}`;
                btn.innerText = b.text;
                btn.onclick = () => {
                    document.getElementById('decision-modal').classList.remove('active');
                    b.action();
                };
                btnContainer.appendChild(btn);
            });

            document.getElementById('decision-modal').classList.add('active');
        }

        function handleTileAction(player, tile) {
            // נכסים ברי קנייה / שדרוג
            if (tile.type === 'property') {
                if (tile.owner === null) {
                    if (player.money >= tile.cost) {
                        showModal("הזדמנות רכישה", `האם תרצה לרכוש את ${tile.title} ב-$${tile.cost}? יקנה לך ${tile.points} נקודות ניצחון.`, [
                            { text: `קנה ב-$${tile.cost}`, btnClass: "btn-green", action: () => {
                                player.money -= tile.cost;
                                player.points += tile.points;
                                tile.owner = currentPlayerIndex;
                                log(`🏢 ${player.name} רכש/ה את ${tile.title}!`);
                                finishTurn();
                            }},
                            { text: "וותר", btnClass: "", action: () => finishTurn() }
                        ]);
                        return;
                    } else {
                        log(`❌ ל-${player.name} אין מספיק כסף לרכוש את ${tile.title}`);
                    }
                } else if (tile.owner === currentPlayerIndex) {
                    // שדרוג נכס קיים
                    let upgradeCost = Math.floor(tile.cost * 0.8);
                    if (player.money >= upgradeCost) {
                        showModal("שדרוג תשתיות", `תרצה לשדרג את ${tile.title} לרמה ${tile.level + 1} ב-$${upgradeCost}? השדרוג יעלה את השכירות ויוסיף 3 נקודות.`, [
                            { text: "שדרג!", btnClass: "btn-gold", action: () => {
                                player.money -= upgradeCost;
                                tile.level += 1;
                                tile.rent = Math.floor(tile.rent * 1.6);
                                player.points += 3;
                                log(`🔝 ${player.name} שדרג/ה את ${tile.title} לרמה ${tile.level}!`);
                                finishTurn();
                            }},
                            { text: "לא עכשיו", btnClass: "", action: () => finishTurn() }
                        ]);
                        return;
                    }
                } else {
                    // תשלום דמי שכירות לבעלים
                    let owner = players[tile.owner];
                    let rentDue = tile.rent;
                    let actualPaid = Math.min(player.money, rentDue);
                    player.money -= actualPaid;
                    owner.money += actualPaid;
                    log(`💸 ${player.name} שילם/ה $${actualPaid} תגמולים ל-${owner.name} עבור הנחיתה ב-${tile.title}`);
                }
            } 
            else if (tile.type === 'work') {
                let earned = tile.income * player.eduLevel;
                player.money += earned;
                log(`💼 ${player.name} ביצע/ה עבודה והרוויח/ה $${earned}`);
            }
            else if (tile.type === 'study') {
                if (player.money >= tile.cost) {
                    showModal("לימודים והכשרה", `ללמוד ב-${tile.title} ב-$${tile.cost}? מעלה מקדם שכר ויוסיף ${tile.points} נקודות.`, [
                        { text: "הירשם ללימודים", btnClass: "btn-green", action: () => {
                            player.money -= tile.cost;
                            player.points += tile.points;
                            player.eduLevel += tile.eduBoost;
                            log(`🎓 ${player.name} השלים/ה לימודים ב-${tile.title}!`);
                            finishTurn();
                        }},
                        { text: "דלג", btnClass: "", action: () => finishTurn() }
                    ]);
                    return;
                }
            }
            else if (tile.type === 'trade') {
                if (player.money >= tile.cost) {
                    showModal("מסחר מהיר", `לבצע עסקת מסחר ב-${tile.title} ב-$${tile.cost} בתמורה ל-${tile.points} נקודות ניצחון?`, [
                        { text: "בצע עסקה", btnClass: "btn-gold", action: () => {
                            player.money -= tile.cost;
                            player.points += tile.points;
                            log(`🪙 ${player.name} ביצע/ה עסקת מוצלחת ב-${tile.title}`);
                            finishTurn();
                        }},
                        { text: "בטל", btnClass: "", action: () => finishTurn() }
                    ]);
                    return;
                }
            }
            else if (tile.type === 'event') {
                if (Math.random() > 0.4) {
                    let win = 35;
                    player.money += win;
                    log(`🎉 אירוע חיובי! ${player.name} קיבל/ה מענק מעודד ע״ס $${win}`);
                } else {
                    let loss = Math.min(player.money, 20);
                    player.money -= loss;
                    log(`⚠️ קנס רגולטורי! ${player.name} שילם/ה $${loss}`);
                }
            }
            else if (tile.type === 'start') {
                player.money += 40;
                log(`🚀 ${player.name} חצה/ה את משבצת ההזנק וקיבל/ה בונוס $40!`);
            }

            finishTurn();
        }

        // פעולות אסטרטגיות יזמיות
        function executeIPO() {
            const player = players[currentPlayerIndex];
            if (player.points >= 2 && !turnHasRolled) {
                player.points -= 2;
                player.money += 45;
                log(`📈 ${player.name} ביצע/ה הנפקת מניות (IPO), גייס/ה $45 בתמורה ל-2 נקודות`);
                updateUI();
            }
        }

        function buildIncubator() {
            const player = players[currentPlayerIndex];
            if (player.money >= 60 && !turnHasRolled) {
                player.money -= 60;
                player.incubators += 1;
                player.points += 2;
                log(`🏗️ ${player.name} הקים/ה חממת סטרטאפים חדשה!`);
                updateUI();
            }
        }

        window.onload = initBoard;
    </script>
</body>
</html>
