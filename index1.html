<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Vibe Quest - העיר הדיגיטלית</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-blue: #38bdf8;
            --accent-purple: #c084fc;
            --accent-green: #4ade80;
            --accent-gold: #facc15;
            --text-color: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rubik', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .subtitle { font-size: 1rem; color: #94a3b8; margin-bottom: 20px; }

        .game-container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* הלוח */
        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 10px;
            width: 550px;
            height: 550px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }

        .tile {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5px;
            text-align: center;
            font-size: 0.8rem;
            position: relative;
            transition: all 0.3s ease;
        }

        .tile-center {
            grid-column: 2 / 5;
            grid-row: 2 / 5;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            padding: 20px;
        }

        .tile-icon { font-size: 1.5rem; margin-bottom: 4px; }
        .tile-title { font-weight: 600; color: #e2e8f0; }

        /* שחקנים על הלוח */
        .tokens-container {
            position: absolute;
            bottom: 4px;
            display: flex;
            gap: 4px;
        }

        .player-token {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 8px currentColor;
            transition: all 0.4s ease;
        }

        /* פאנל שליטה ושחקנים */
        .controls-panel {
            flex: 1;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .players-list { display: flex; flex-direction: column; gap: 10px; }

        .player-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.4);
            border: 2px solid transparent;
            transition: 0.3s;
        }

        .player-card.active {
            border-color: var(--accent-blue);
            background: rgba(56, 189, 248, 0.1);
            transform: scale(1.02);
        }

        .player-info { display: flex; align-items: center; gap: 10px; }
        .player-avatar { width: 12px; height: 12px; border-radius: 50%; }

        /* קוביה וכפתורים */
        .dice-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .dice {
            width: 60px;
            height: 60px;
            background: var(--text-color);
            color: var(--bg-color);
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            transition: transform 0.5s ease;
        }

        .roll-animation { animation: spin 0.5s ease-out; }
        @keyframes spin { 0% { transform: rotate(0deg) scale(0.5); } 100% { transform: rotate(360deg) scale(1); } }

        button {
            background: linear-gradient(45deg, var(--accent-blue), var(--accent-purple));
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(192, 132, 252, 0.3);
            width: 100%;
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(192, 132, 252, 0.5); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .log-box {
            height: 120px;
            overflow-y: auto;
            font-size: 0.85rem;
            color: #cbd5e1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .log-entry { padding: 4px 8px; border-radius: 4px; background: rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <h1>GEMINI VIBE QUEST</h1>
    <div class="subtitle">המירוץ ל-40 נקודות ניצחון - עבודה, לימודים ומסחר</div>

    <div class="game-container">
        <div class="board" id="board">
            <div class="tile-center">
                <div class="dice-area">
                    <div class="dice" id="dice">?</div>
                    <button id="roll-btn" onclick="playTurn()">הטל קוביה</button>
                </div>
            </div>
        </div>

        <div class="controls-panel">
            <div class="card">
                <h3>שחקנים</h3>
                <div class="players-list" id="players-list"></div>
            </div>

            <div class="card">
                <h3>יומן אירועים</h3>
                <div class="log-box" id="log-box"></div>
            </div>
        </div>
    </div>

    <script>
        const TARGET_POINTS = 40;
        const playerColors = ['#38bdf8', '#c084fc', '#4ade80', '#facc15'];
        
        // הגדרת המשבצות במסלול ההיקפי (16 משבצות)
        const boardTiles = [
            { id: 0, title: "התחלה", icon: "🚀", type: "start" },
            { id: 1, title: "מכללה", icon: "📚", type: "study", cost: 20, points: 2, level: 1 },
            { id: 2, title: "עבודת פרילנס", icon: "💻", type: "work", income: 15 },
            { id: 3, title: "חנות נוחות", icon: "🛒", type: "shop", cost: 15, points: 3 },
            { id: 4, title: "הזדמנות", icon: "🎲", type: "event" },
            { id: 5, title: "אוניברסיטה", icon: "🎓", type: "study", cost: 40, points: 5, level: 2 },
            { id: 6, title: "חברת הייטק", icon: "🏢", type: "work", income: 35 },
            { id: 7, title: "מניות סטרטאפ", icon: "📈", type: "trade", cost: 30, points: 6 },
            { id: 8, title: "מנוחה", icon: "☕", type: "rest" },
            { id: 9, title: "קורס יוקרתי", icon: "📜", type: "study", cost: 60, points: 8, level: 3 },
            { id: 10, title: "עסק עצמאי", icon: "👔", type: "work", income: 50 },
            { id: 11, title: "נדל״ן עסקי", icon: "🏗️", type: "shop", cost: 70, points: 12 },
            { id: 12, title: "הפתעה", icon: "🎁", type: "event" },
            { id: 13, title: "מסחר בקריפטו", icon: "🪙", type: "trade", cost: 50, points: 9 },
            { id: 14, title: "פרויקט ענק", icon: "🚀", type: "work", income: 70 },
            { id: 15, title: "מכירת פטנט", icon: "💡", type: "trade", cost: 90, points: 15 }
        ];

        // מפת מיקומים ב-Grid של 5x5
        const gridPositions = [
            {r:5, c:5}, {r:5, c:4}, {r:5, c:3}, {r:5, c:2}, {r:5, c:1},
            {r:4, c:1}, {r:3, c:1}, {r:2, c:1}, {r:1, c:1},
            {r:1, c:2}, {r:1, c:3}, {r:1, c:4}, {r:1, c:5},
            {r:2, c:5}, {r:3, c:5}, {r:4, c:5}
        ];

        let players = [
            { id: 1, name: "שחקן 1", color: playerColors[0], position: 0, money: 30, points: 0, eduLevel: 1 },
            { id: 2, name: "שחקן 2", color: playerColors[1], position: 0, money: 30, points: 0, eduLevel: 1 },
            { id: 3, name: "שחקן 3", color: playerColors[2], position: 0, money: 30, points: 0, eduLevel: 1 }
        ];

        let currentPlayerIndex = 0;

        // אתחול הלוח והשחקנים
        function initBoard() {
            const boardEl = document.getElementById('board');
            
            boardTiles.forEach((tile, index) => {
                const pos = gridPositions[index];
                const tileEl = document.createElement('div');
                tileEl.className = 'tile';
                tileEl.id = `tile-${index}`;
                tileEl.style.gridRow = pos.r;
                tileEl.style.gridColumn = pos.c;
                
                tileEl.innerHTML = `
                    <div class="tile-icon">${tile.icon}</div>
                    <div class="tile-title">${tile.title}</div>
                    <div class="tokens-container" id="tokens-${index}"></div>
                `;
                boardEl.appendChild(tileEl);
            });

            updateUI();
            log("המשחק התחיל! המטרה: להגיע ל-40 נקודות.");
        }

        function updateUI() {
            // עדכון רשימת שחקנים
            const playersList = document.getElementById('players-list');
            playersList.innerHTML = '';
            
            players.forEach((p, idx) => {
                const card = document.createElement('div');
                card.className = `player-card ${idx === currentPlayerIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="player-info">
                        <div class="player-avatar" style="background: ${p.color}; box-shadow: 0 0 8px ${p.color}"></div>
                        <strong>${p.name}</strong>
                    </div>
                    <div>💰 $${p.money} | 🏆 ${p.points} | 🎓 רמה ${p.eduLevel}</div>
                `;
                playersList.appendChild(card);
            });

            // עדכון מיקומי אסימונים
            boardTiles.forEach((_, idx) => {
                const container = document.getElementById(`tokens-${idx}`);
                container.innerHTML = '';
            });

            players.forEach(p => {
                const container = document.getElementById(`tokens-${p.position}`);
                const token = document.createElement('div');
                token.className = 'player-token';
                token.style.backgroundColor = p.color;
                container.appendChild(token);
            });
        }

        function log(msg) {
            const logBox = document.getElementById('log-box');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerText = msg;
            logBox.prepend(entry);
        }

        function playTurn() {
            const rollBtn = document.getElementById('roll-btn');
            rollBtn.disabled = true;

            const diceEl = document.getElementById('dice');
            diceEl.classList.add('roll-animation');
            
            setTimeout(() => {
                const roll = Math.floor(Math.random() * 6) + 1;
                diceEl.innerText = roll;
                diceEl.classList.remove('roll-animation');

                const player = players[currentPlayerIndex];
                player.position = (player.position + roll) % boardTiles.length;

                log(`${player.name} הטיל/ה ${roll} ונחת/ה על ${boardTiles[player.position].title}`);

                handleTileAction(player, boardTiles[player.position]);

                // בדיקת ניצחון
                if (player.points >= TARGET_POINTS) {
                    alert(`🎉 כל הכבוד! ${player.name} ניצח/ה עם ${player.points} נקודות!`);
                    location.reload();
                    return;
                }

                // מעבר תור
                currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
                updateUI();
                rollBtn.disabled = false;
            }, 500);
        }

        function handleTileAction(player, tile) {
            switch(tile.type) {
                case 'work':
                    let earned = tile.income * player.eduLevel;
                    player.money += earned;
                    log(`💵 ${player.name} עבד/ה והרוויח/ה $${earned} (מוכפל בזכות רמת הלימודים!)`);
                    break;

                case 'study':
                    if (player.money >= tile.cost) {
                        player.money -= tile.cost;
                        player.points += tile.points;
                        player.eduLevel += 1;
                        log(`🎓 ${player.name} למד/ה, שילם/ה $${tile.cost}, הטיפש/ה עלה/תה לרמה ${player.eduLevel} והרוויח/ה ${tile.points} נקודות!`);
                    } else {
                        log(`❌ ל-${player.name} אין מספיק כסף ללמוד ($${tile.cost} נדרשים).`);
                    }
                    break;

                case 'shop':
                case 'trade':
                    if (player.money >= tile.cost) {
                        player.money -= tile.cost;
                        player.points += tile.points;
                        log(`🛍️ ${player.name} קנה/סחר ב-${tile.title} ב-$${tile.cost} וקיבל/ה ${tile.points} נקודות!`);
                    } else {
                        log(`❌ ל-${player.name} אין מספיק כסף לעסקה ($${tile.cost} נדרשים).`);
                    }
                    break;

                case 'event':
                    let chance = Math.random();
                    if (chance > 0.5) {
                        player.money += 25;
                        log(`🎁 אירוע חיובי! ${player.name} מצא/ה מענק ע״ס $25`);
                    } else {
                        let loss = Math.min(player.money, 15);
                        player.money -= loss;
                        log(`⚠️ אירוע לא צפוי! ${player.name} שילם/ה מס ע״ס $${loss}`);
                    }
                    break;

                case 'start':
                    player.money += 30;
                    log(`🚀 ${player.name} עבר/ה בהתחלה וקיבל/ה בונוס $30!`);
                    break;
            }
        }

        window.onload = initBoard;
    </script>
</body>
</html>
